name: Build
run-name: Build ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия для сборки (пусто — взять из файла VERSION)"
        required: false
        type: string

jobs:
  build:
    runs-on: windows-latest
    env:
      # windows-latest has a C compiler in PATH (unlike the maintainer's own dev machine), so
      # without this, `go build` silently enables cgo here and links against MinGW's runtime
      # DLLs (libgcc_s_seh-1.dll, libwinpthread-1.dll, libstdc++-6.dll) — present on this
      # runner, absent on a plain Windows install, so the built exe fails to even start there.
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Set version
        if: inputs.version != ''
        shell: pwsh
        run: Set-Content -Path VERSION -Value '${{ inputs.version }}'
      - name: Build (gofmt, vet, tests, exe, installer, archives)
        shell: pwsh
        run: .\build.ps1
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: equinox-${{ inputs.version || github.sha }}
          path: |
            dist/Equinox-Setup.exe
            dist/Equinox-pc.zip
            dist/Equinox-server.zip
            dist/SHA256SUMS.txt
          retention-days: 30
