name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build (gofmt, vet, tests, exe, installer, archives)
        shell: pwsh
        run: .\build.ps1
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: equinox-${{ github.sha }}
          path: |
            dist/Equinox-Setup.exe
            dist/Equinox-pc.zip
            dist/Equinox-server.zip
            dist/SHA256SUMS.txt
          retention-days: 30
