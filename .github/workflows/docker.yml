name: Docker image
run-name: Docker image ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}

# Manual, like the Build workflow: publishes ghcr.io/ozzvin/equinox:<version> and :latest for linux/amd64 and
# linux/arm64. The package is private until it is made public in the package settings on GitHub.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия образа (пусто — взять из файла VERSION)"
        required: false
        type: string
      push:
        description: "Опубликовать образ в ghcr.io (иначе только собрать и проверить)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Version
        id: v
        run: |
          v='${{ inputs.version }}'
          [ -n "$v" ] || v=$(tr -d '[:space:]' < VERSION)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build the server for both architectures
        run: |
          mkdir -p bin
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/Ozzvin/equinox/internal/buildinfo.Version=${{ steps.v.outputs.version }}" \
              -o bin/equinox-server-linux-$arch ./cmd/equinox-server
          done
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # The image is run once before anything is published: it must come up in open mode, hand out the open key,
      # answer the API with it, and refuse a host name that could be a DNS rebinding.
      - name: Build an amd64 image for a smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: equinox-smoke
      - name: Smoke test
        run: |
          docker run -d --name eq -p 8080:8080 equinox-smoke -open -listen 0.0.0.0:8080 -no-browser -state /tmp/state -downloads /tmp/dl
          ok=0
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8080/session.js > /dev/null; then ok=1; break; fi
            sleep 1
          done
          docker logs eq
          [ "$ok" = 1 ] || { echo "the server did not come up"; exit 1; }
          curl -sf http://127.0.0.1:8080/session.js | grep -q '__equinoxToken = "open"'
          curl -sf -H 'Authorization: Bearer open' http://127.0.0.1:8080/api/settings | grep -q dataDir
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/settings)
          [ "$code" = 401 ] || { echo "no header must be 401, got $code"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example.com' http://127.0.0.1:8080/)
          [ "$code" = 403 ] || { echo "a foreign host must be 403, got $code"; exit 1; }
          docker rm -f eq
      - name: Log in to ghcr.io
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: |
            ghcr.io/ozzvin/equinox:${{ steps.v.outputs.version }}
            ghcr.io/ozzvin/equinox:latest
          labels: |
            org.opencontainers.image.source=https://github.com/Ozzvin/equinox
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=MIT
