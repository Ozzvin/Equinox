# Flatpak of the desktop program (tray icon, the interface in the browser), built by the "linux" job of
# .github/workflows/build.yml for x86_64 from the binary the job already built (the files named below are copied next
# to this manifest into stage/flatpak first). It is a bundle for "flatpak install ./Equinox-linux-amd64.flatpak", not a
# Flathub submission (Flathub builds from source).
app-id: io.github.ozzvin.Equinox
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: equinox
finish-args:
  # peers, trackers, the web interface on localhost
  - --share=network
  # the Downloads folder is where a first start saves torrents; other folders are chosen in the portal's dialog
  - --filesystem=xdg-download
  # the tray icon, notifications, "show in folder"
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.FileManager1
modules:
  - name: equinox
    buildsystem: simple
    build-commands:
      - install -Dm755 equinox /app/bin/equinox
      - install -Dm644 io.github.ozzvin.Equinox.desktop /app/share/applications/io.github.ozzvin.Equinox.desktop
      - install -Dm644 icon256.png /app/share/icons/hicolor/256x256/apps/io.github.ozzvin.Equinox.png
      - install -Dm644 icon48.png /app/share/icons/hicolor/48x48/apps/io.github.ozzvin.Equinox.png
    sources:
      - type: file
        path: equinox
      - type: file
        path: io.github.ozzvin.Equinox.desktop
      - type: file
        path: icon256.png
      - type: file
        path: icon48.png
