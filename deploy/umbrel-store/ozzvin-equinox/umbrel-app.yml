id: ozzvin-equinox
category: files
name: Equinox
version: "1.0.19"
tagline: A fast, tidy BitTorrent client
description: >-
  Equinox is a lightweight BitTorrent client with a clean web interface.


  Add torrents by magnet link or .torrent file, or make your own; queue downloads, set priorities for single files,
  download sequentially, limit speeds and seeding by ratio or time, and cap how many torrents seed at once.
  Labels can have their own folders, and the list can be searched, sorted and filtered. It supports DHT, PEX, uTP,
  encryption and IPv6.


  Sign in with your Umbrel password as usual: Equinox itself has no separate login here. For incoming connections
  forward TCP and UDP port 51413 on your router to your Umbrel.
