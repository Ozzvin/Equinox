manifestVersion: 1
id: ozzvin-equinox
storage:
  dataRoot: data
folderAccess:
  - id: umbrel-downloads
    name: Downloads
    note: Equinox downloads into Home/Downloads/Equinox/incomplete and moves finished torrents to Home/Downloads/Equinox/complete. To use another folder (an external drive), add it under "Add your own folder" with the path Files shows for it, such as /External/RAID/Torrents, and pick it in Equinox.
    mounts:
      - service: server
        targetPath: /downloads
        readOnly: false
permissions:
  - STORAGE_DOWNLOADS
category: files
name: Equinox
version: "1.1.0-rc7"
tagline: A fast, tidy BitTorrent client
icon: https://cdn.jsdelivr.net/gh/Ozzvin/umbrel-community-app-store@main/ozzvin-equinox/icon.svg
description: >-
  Equinox is a lightweight BitTorrent client with a clean web interface.


  Add torrents by magnet link or .torrent file, or make your own; queue downloads, set priorities for single files,
  download sequentially, limit speeds and seeding by ratio or time, and cap how many torrents seed at once.
  Labels can have their own folders, and the list can be searched, sorted and filtered. It supports DHT, PEX, uTP,
  encryption and IPv6.


  Downloads go to Home/Downloads/Equinox/incomplete and move to Home/Downloads/Equinox/complete when finished, so a
  media server pointed at the complete folder never sees a half-downloaded file. Any other folder, such as an external
  drive, can be added in the app's settings: mount it at the path Files shows for it (for example
  /External/RAID/Torrents) and Equinox shows it by that path.


  Sign in with your Umbrel password as usual: Equinox itself has no separate login here. For incoming connections
  Equinox opens port 51420 on your router itself when the router supports NAT-PMP; otherwise forward TCP and UDP
  port 51420 on your router to your Umbrel by hand.
developer: Ozzvin
website: https://github.com/Ozzvin/equinox
dependencies: []
repo: https://github.com/Ozzvin/equinox
support: https://github.com/Ozzvin/equinox/issues
port: 8091
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Unreleased in this store yet: see https://github.com/Ozzvin/equinox/blob/main/CHANGELOG.md
submitter: Ozzvin
submission: ""
