version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: ozzvin-equinox_server_1
      APP_PORT: 8080

  server:
    image: ghcr.io/ozzvin/equinox:1.1.0-rc7
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    # -open: Umbrel's app proxy signs the user in, so Equinox asks for no key of its own.
    command:
      - -open
      - -listen
      - 0.0.0.0:8080
      - -no-browser
      - -state
      - /data
      # its own folder in Downloads: downloading into incomplete, finished torrents moved to complete
      - -downloads
      - /downloads/Equinox/incomplete
      - -completed
      - /downloads/Equinox/complete
      # the one port published below: the page cannot move the program off it (51413 is Transmission's)
      - -torrent-port
      - "51420"
      # Downloads by the path Umbrel's Files shows it at; a folder added in the app's settings shows by its mount
      # point, so mounted at /External/RAID/Torrents it reads as in Files too
      - -place
      - Home/Downloads=/downloads
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    ports:
      - 51420:51420/tcp
      - 51420:51420/udp
